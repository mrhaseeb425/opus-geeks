<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opus Geeks — Software, Web &amp; App Development</title>
    <meta
      name="description"
      content="Opus Geeks designs and builds web platforms, mobile apps, UI/UX and games for startups and enterprises."
    />
    <!-- Apply the saved/system theme before first paint so dark-mode users
         never see a flash of the light theme. Mirrors lib/theme.js. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("og-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
