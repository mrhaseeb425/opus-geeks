<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1631" />
    <link rel="preconnect" href="https://images.pexels.com" />
    <!-- Per-route values below are rewritten at build time (vite.config.js
         prerenderMeta) and kept in sync at runtime by useDocumentMeta. -->
    <title>Opus Geeks | Web and Mobile App Development</title>
    <meta
      name="description"
      content="Opus Geeks designs and builds web platforms, mobile apps, UI/UX and games for startups and growing companies."
    />
    <link rel="canonical" href="https://opusgeeks.com/" />
    <meta property="og:site_name" content="Opus Geeks" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Opus Geeks | Web and Mobile App Development" />
    <meta
      property="og:description"
      content="Opus Geeks designs and builds web platforms, mobile apps, UI/UX and games for startups and growing companies."
    />
    <meta property="og:url" content="https://opusgeeks.com/" />
    <meta property="og:image" content="https://opusgeeks.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Opus Geeks | Web and Mobile App Development" />
    <meta
      name="twitter:description"
      content="Opus Geeks designs and builds web platforms, mobile apps, UI/UX and games for startups and growing companies."
    />
    <meta name="twitter:image" content="https://opusgeeks.com/og-image.jpg" />
    <!-- Apply the saved/system theme before first paint so dark-mode users
         never see a flash of the light theme. Mirrors lib/theme.js. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("og-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <!-- Static copy of the Preloader (components/Preloader.jsx) so the first
         paint happens as soon as the CSS arrives, not after the JS bundle
         runs. React replaces it on its first render. -->
    <div id="root"><div class="preloader" aria-hidden="true"><span class="preloader-brand">OPUS GEEKS</span><div class="preloader-bar-track"><span class="preloader-bar-fill"></span></div><span class="preloader-count">0%</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
