    <!-- Structured data. Rewritten per route by prerenderMeta (vite.config.js)
         and kept in sync on client-side navigation by useDocumentMeta. -->
    <script type="application/ld+json" data-schema>{}</script>
    <!-- Apply the saved/system theme before first paint so dark-mode users
         never see a flash of the light theme. Mirrors lib/theme.js. -->
    <script>
      (function () {
        try {
          // Opus Geeks is a dark site: dark is the default for everyone,
          // regardless of OS preference. Light is available, but only when
          // the visitor picks it from the header toggle.
          var saved = localStorage.getItem("og-theme");
          var dark = saved ? saved === "dark" : true;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

  </body>
